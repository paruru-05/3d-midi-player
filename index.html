<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MIDIを3D空間で可視化するブラウザベースのMIDIプレイヤー。Fall、PianoRoll 3D、TopDown、Keyboard 3Dビューを搭載。" />
    <meta name="theme-color" content="#0b0d12" />
    <title>3D MIDI Player</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b0d12; color:#e6e6e6; font-family:system-ui,sans-serif; }
      #app { display:grid; grid-template-columns: 260px 1fr 300px; grid-template-rows: 56px 1fr; height:100vh; }
      #app:fullscreen { width:100vw; height:100vh; }
      #topbar { grid-column:1/4; display:flex; align-items:center; gap:8px; padding:0 12px; background:#11141b; border-bottom:1px solid #1f2330; overflow-x:auto; }
      #topbar > * { flex:none; }
      #tracks { background:#0e1118; border-right:1px solid #1f2330; overflow:auto; padding:8px; }
      #stage { position:relative; overflow:hidden; }
      #canvas { width:100%; height:100%; display:block; cursor:grab; }
      #params { background:#0e1118; border-left:1px solid #1f2330; overflow:auto; }
      button, input, select { background:#1a1f2b; color:#e6e6e6; border:1px solid #2a3040; border-radius:6px; padding:6px 10px; cursor:pointer; }
      button:hover { background:#23293a; }
      button:disabled { opacity:.45; cursor:not-allowed; }
      input[type=file] { display:none; }
      #seek { flex:1; min-width:120px; }
      #time { font-variant-numeric:tabular-nums; min-width:110px; text-align:center; }
      .track { display:flex; align-items:center; gap:6px; padding:6px; border-bottom:1px solid #1a1f2b; font-size:12px; }
      .track .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .track input[type=range] { width:60px; }
      .label { font-size:12px; color:#9aa4b2; white-space:nowrap; }
      #loading { position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.58); backdrop-filter:blur(2px); }
      #loading.hidden { display:none; }
      .loading-box { display:flex; flex-direction:column; align-items:center; gap:14px; color:#1d2430; font-size:14px; font-weight:600; letter-spacing:.04em; text-shadow:0 1px 0 rgba(255,255,255,.6); }
      .spinner { width:44px; height:44px; border-radius:50%; border:4px solid rgba(35,50,80,.18); border-top-color:#3a66c9; animation:spin .8s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <label for="file" class="label">MIDI</label>
        <button id="loadBtn">ファイルを開く</button>
        <input type="file" id="file" accept=".mid,.midi" />
        <button id="playBtn">▶</button>
        <button id="stopBtn">■</button>
        <select id="viewSel">
          <option value="fall">Fall</option>
          <option value="pianoroll">PianoRoll 3D</option>
          <option value="topdown">TopDown</option>
          <option value="keyboard">Keyboard 3D</option>
        </select>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1" />
        <span id="time">00:00 / 00:00</span>
        <input type="range" id="speed" min="0.25" max="2" value="1" step="0.05" />
        <span class="label">speed</span>
        <input type="range" id="volume" min="0" max="1" value="0.8" step="0.01" />
        <span class="label">vol</span>
        <button id="resetCamBtn" title="カメラ位置をリセット">視点リセット</button>
        <button id="fsBtn" title="全画面 (F)">全画面</button>
      </div>
      <div id="tracks"></div>
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="loading" class="hidden">
          <div class="loading-box">
            <div class="spinner"></div>
            <span id="loadingText">MIDIと音源を読み込み中...</span>
          </div>
        </div>
      </div>
      <div id="params"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
